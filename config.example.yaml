# ============================================================================
# BDP Analyzer 設定ファイル (config.yaml としてコピーして使用)
# ============================================================================

# 自局(地上局)の位置。ハンドオーバー予測とアンテナ向き検証に使用。
ground_station:
  name: "tokyo-office"
  latitude: 35.6762        # 度 (北緯 +)
  longitude: 139.6503      # 度 (東経 +)
  altitude_m: 40           # 標高 [m]
  elevation_mask_deg: 25   # この仰角未満は通信不可とみなす(ハンドオーバー判定に使用)

# 保存先
storage:
  db_path: "data/bdp.sqlite"

# ----------------------------------------------------------------------------
# RF コレクタ (電波側メトリクス)。使う機器だけ enabled: true にする。
# ----------------------------------------------------------------------------
collectors:
  # Starlink Mini: RF 用 WebGUI は無いが Dish の gRPC からメトリクス取得可能
  - name: "starlink-mini-1"
    kind: "starlink"
    enabled: false
    address: "192.168.100.1:9200"   # Dishy gRPC。ルータ経由なら要ルーティング
    interval_s: 5
    history: true                   # get_history で 1 秒解像度の履歴を差分回収
                                    # (ソース名 <name>:1s として保存)
    # grpcurl: "grpcurl"            # PATH に無い場合は絶対パスを指定

  # Kymeta (OneWeb 運用): HTTPS WebGUI をスクレイプ。IP を指定するだけ。
  - name: "kymeta-oneweb-1"
    kind: "kymeta"
    enabled: false
    base_url: "https://192.168.1.50"   # 端末 WebGUI の IP
    verify_tls: false                   # 自己署名証明書のことが多い
    username: "admin"
    password: "CHANGE_ME"
    interval_s: 10
    # WebGUI の JSON/HTML から値を拾うマッピング。機種・ファームで異なるので
    # 実機に合わせて調整する (docs/devices.md 参照)。
    endpoints:
      status_json: "/api/status"        # JSON があればこちらを優先
    field_map:
      sinr_db: "rf.sinr"
      azimuth_deg: "pointing.azimuth"
      elevation_deg: "pointing.elevation"
      tx_freq_mhz: "rf.tx_frequency_mhz"
      rx_freq_mhz: "rf.rx_frequency_mhz"
      satellite_id: "network.satellite"

  # OneWeb Intellian OW11: 公開 API 非公開。LUI スクレイプ or SNMP を設定。
  - name: "intellian-oneweb-1"
    kind: "intellian"
    enabled: false
    base_url: "https://192.168.100.1"
    verify_tls: false
    interval_s: 10
    # SNMP を使う場合 (機種が対応していれば):
    snmp:
      enabled: false
      host: "192.168.100.1"
      community: "public"
      oids:                 # 実機の MIB に合わせる
        sinr_db: "1.3.6.1.4.1.XXXXX.1"
        elevation_deg: "1.3.6.1.4.1.XXXXX.2"

# ----------------------------------------------------------------------------
# インターネット通信品質測定 (1 ソフトで送受兼用)
#   role: "both"(既定) にすると、この 1 プロセスが
#     - 受信サーバを常駐 (対向がこちらへ測定できる) かつ
#     - peer_host へ能動測定 (上り・下り 両方向 + RTT/ジッタ/ロス)
#   を同時に行う。両 PC で同じ設定・同じコマンドを動かし、互いを peer_host に
#   指定すれば対称な双方向測定になる。
#   ※ 上り/下りは role に関わらず 1 回の測定で両方取得する(送信側視点)。
#   role="sender"(測定のみ) / "receiver"(応答のみ) も選択可。
# ----------------------------------------------------------------------------
netqual:
  enabled: true
  role: "both"              # "both"(送受兼用) / "sender"(測定のみ) / "receiver"(応答のみ)
  serve: true               # 受信サーバを常駐するか (未指定なら role から自動)
  control_port: 5301        # TCP: 制御 & スループット
  udp_port: 5302            # UDP: ジッタ/RTT/ロス
  interval_s: 30            # 測定周期 (targets 側で個別上書き可)
  throughput_seconds: 5     # 1 回の TCP スループット測定時間
  udp_probe_count: 200      # 1 回の UDP プローブ数
  udp_probe_interval_ms: 20 # UDP プローブ送出間隔

  # 測定先は複数登録でき、ラベル別にグラフ表示される。
  # Web UI (計測コントロール) からも追加/削除/ON・OFF できるので、
  # ここには常用の測定先だけ書けばよい。
  # 衛星なしの Ether / Wi-Fi 品質チェックも、LAN 内の相手 PC で
  # `python -m bdp_analyzer receiver` を起動して host に指定するだけ。
  # マルチ NIC (USB-Ether 等で複数回線を同時接続) の場合は、測定先ごとに
  # bind_ip = そのアダプタの自分側 IP を指定すると、測定トラフィックの
  # 送信元がそのアダプタに固定される (= 回線ごとの同時測定が可能)。
  # bind_ip 未指定なら OS のデフォルトルートで送信される。
  targets:
    - label: "Starlink経由"
      host: "203.0.113.10"     # 対向 PC の到達アドレス
      enabled: true
      rtt_monitor: false       # true で常時 RTT モニタ (1 秒解像度) も起動
      # bind_ip: "192.168.1.100"   # Starlink 側アダプタの自分の IP
    - label: "社内有線LAN"
      host: "192.168.1.20"
      enabled: false           # UI から ON にするまで停止
    # - label: "OneWeb経由"
    #   host: "203.0.113.10"       # 同じ対向でも別アダプタ経由で測れる
    #   bind_ip: "10.0.50.23"      # OneWeb 側アダプタの自分の IP

  # (旧形式) peer_host: "203.0.113.10" も引き続き使用可 (targets が無い場合のみ)

# ----------------------------------------------------------------------------
# ハンドオーバー予測 (TLE + SGP4)
# ----------------------------------------------------------------------------
handover:
  enabled: true
  interval_s: 30
  horizon_min: 15          # 何分先まで予測するか
  constellations: ["starlink", "oneweb"]
  tle_cache_hours: 6       # CelesTrak TLE キャッシュ有効期間
  tle_sources:
    starlink: "https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=tle"
    oneweb:   "https://celestrak.org/NORAD/elements/gp.php?GROUP=oneweb&FORMAT=tle"

# ----------------------------------------------------------------------------
# Web ダッシュボード
# ----------------------------------------------------------------------------
webapp:
  enabled: true
  host: "0.0.0.0"
  port: 8080
