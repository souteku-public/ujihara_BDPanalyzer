<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BDP Analyzer — LEO 通信品質モニタ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#0f1420; --card:#1a2233; --fg:#e6ebf5; --muted:#8b98b0; --accent:#4da3ff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:14px 20px; background:var(--card); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
    header h1 { font-size:18px; margin:0; }
    header .ctrl { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:13px; color:var(--muted); }
    select, input { background:#0c1119; color:var(--fg); border:1px solid #2a3550; border-radius:6px; padding:5px 8px; }
    main { padding:20px; display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:18px; }
    .card { background:var(--card); border-radius:12px; padding:16px; }
    .card h2 { font-size:14px; margin:0 0 12px; color:var(--muted); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
    .kpis { display:flex; gap:18px; flex-wrap:wrap; }
    .kpi { min-width:110px; }
    .kpi .v { font-size:26px; font-weight:700; }
    .kpi .l { font-size:12px; color:var(--muted); }
    .sat { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #232c40; }
    .sat:last-child { border-bottom:none; }
    .pill { font-size:11px; padding:2px 8px; border-radius:20px; background:#243352; color:var(--accent); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #232c40; }
    th { color:var(--muted); font-weight:600; }
    tr.future td { color:var(--accent); }
    .full { grid-column:1/-1; }
    canvas { max-height:300px; }
    .compass { width:150px; height:150px; }
    /* 計測コントロール */
    .jobgroup { margin-bottom:10px; }
    .jobgroup .gt { font-size:12px; color:var(--muted); margin:6px 0 4px; }
    .job { display:flex; align-items:center; gap:10px; padding:6px 8px;
           border-radius:8px; }
    .job:hover { background:#212b42; }
    .job .lbl { flex:1; }
    .job .detail { color:var(--muted); font-size:12px; }
    .job .del { cursor:pointer; color:var(--muted); border:none; background:none; font-size:14px; }
    .job .del:hover { color:#ff7a7a; }
    .switch { position:relative; width:38px; height:20px; flex:none; }
    .switch input { opacity:0; width:0; height:0; }
    .switch .sl { position:absolute; inset:0; background:#2a3550; border-radius:20px; transition:.15s; cursor:pointer; }
    .switch .sl:before { content:""; position:absolute; width:14px; height:14px; left:3px; top:3px;
                         background:#8b98b0; border-radius:50%; transition:.15s; }
    .switch input:checked + .sl { background:var(--accent); }
    .switch input:checked + .sl:before { transform:translateX(18px); background:#fff; }
    .addform { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    .addform input { flex:1; min-width:120px; }
    .addform button { background:var(--accent); color:#0b1220; border:none;
                      border-radius:6px; padding:6px 12px; font-weight:600; cursor:pointer; }
    .hint { color:var(--muted); font-size:12px; margin-top:8px; line-height:1.5; }
  </style>
</head>
<body>
  <header>
    <h1>🛰️ BDP Analyzer — LEO 通信品質モニタ</h1>
    <div class="ctrl">
      <label>RF ソース <select id="source"><option value="">(全て)</option></select></label>
      <label>測定先 <select id="netsession"><option value="">(全て)</option></select></label>
      <label>期間 <select id="minutes">
        <option value="15">15分</option>
        <option value="30" selected>30分</option>
        <option value="60">60分</option>
        <option value="180">3時間</option>
      </select></label>
      <span id="updated"></span>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>計測コントロール</h2>
      <div id="jobs"></div>
      <div class="addform">
        <input id="tLabel" placeholder="ラベル (例: 社内LAN / Wi-Fi)">
        <input id="tHost" placeholder="相手ホスト (IPアドレス)">
        <button onclick="addTarget()">＋ 測定先を追加</button>
      </div>
      <div class="hint">
        Ether / Wi-Fi など衛星なしの品質チェック: 相手 PC で
        <code>python -m bdp_analyzer receiver</code> を起動し、その IP を上で追加。
        トグルの ON/OFF は即時反映され、再起動後も保持されます。
      </div>
    </section>

    <section class="card">
      <h2>現在の RF 状態</h2>
      <div class="kpis" id="rfkpi"></div>
    </section>

    <section class="card">
      <h2>接続中と推定される衛星 / 次のハンドオーバー</h2>
      <div id="serving"></div>
    </section>

    <section class="card full">
      <h2>SINR vs スループット</h2>
      <canvas id="chSinrTp"></canvas>
    </section>

    <section class="card">
      <h2>SINR vs RTT / ジッタ</h2>
      <canvas id="chSinrRtt"></canvas>
    </section>

    <section class="card">
      <h2>パケットロス</h2>
      <canvas id="chLoss"></canvas>
    </section>

    <section class="card full">
      <h2>ハンドオーバー予測タイムライン</h2>
      <table id="hoTable">
        <thead><tr><th>時刻</th><th>状態</th><th>系</th><th>from → to</th><th>理由</th><th>仰角</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

<script>
const $ = s => document.querySelector(s);
let charts = {};

async function getJSON(url) { const r = await fetch(url); return r.json(); }
function q() { return `minutes=${$('#minutes').value}` + ($('#source').value ? `&source=${encodeURIComponent($('#source').value)}` : ''); }
function fmtTs(ts) { return new Date(ts*1000).toLocaleTimeString('ja-JP'); }
function mbps(v) { return v==null ? '—' : (v/1e6).toFixed(1); }

function lineChart(id, cfg) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart($(id), cfg);
}

async function refreshSources() {
  const src = await getJSON('/api/sources');
  const sel = $('#source'); const cur = sel.value;
  sel.innerHTML = '<option value="">(全て)</option>' + src.map(s=>`<option>${s}</option>`).join('');
  sel.value = cur;
}

async function refreshRF() {
  const rf = await getJSON('/api/rf?'+q());
  const last = rf[rf.length-1] || {};
  const kpi = [
    ['SINR', last.sinr_db!=null? last.sinr_db.toFixed(1):'—', 'dB'],
    ['方位角', last.azimuth_deg!=null? last.azimuth_deg.toFixed(0):'—', '°'],
    ['仰角', last.elevation_deg!=null? last.elevation_deg.toFixed(0):'—', '°'],
    ['TX周波数', last.tx_freq_mhz!=null? last.tx_freq_mhz.toFixed(0):'—', 'MHz'],
    ['障害物', last.obstruction_pct!=null? last.obstruction_pct.toFixed(1):'—', '%'],
    ['端末遅延', last.latency_ms!=null? last.latency_ms.toFixed(0):'—', 'ms'],
  ];
  $('#rfkpi').innerHTML = kpi.map(k=>`<div class="kpi"><div class="v">${k[1]}<span style="font-size:13px;color:var(--muted)"> ${k[2]}</span></div><div class="l">${k[0]}</div></div>`).join('');
  return rf;
}

async function refreshServing() {
  const s = await getJSON('/api/serving');
  const ho = await getJSON('/api/handovers?'+q());
  const now = Date.now()/1000;
  const nextByCon = {};
  ho.filter(h=>h.ts>now).forEach(h=>{ if(!nextByCon[h.constellation]) nextByCon[h.constellation]=h; });
  let html = '';
  for (const con of ['starlink','oneweb']) {
    const info = s[con];
    if (!info) continue;
    const nxt = nextByCon[con];
    const lead = nxt ? `${Math.round(nxt.ts-now)}秒後` : '—';
    html += `<div class="sat"><div><b>${con}</b> <span class="pill">可視 ${info.visible_count||0}</span><br>
      <span style="color:var(--muted)">サービス衛星: ${info.satellite||'なし'} `+
      (info.elevation_deg!=null?`(仰角 ${info.elevation_deg}°, 方位 ${info.azimuth_deg}°)`:'')+`</span></div>
      <div style="text-align:right">次HO<br><b style="color:var(--accent)">${lead}</b></div></div>`;
  }
  $('#serving').innerHTML = html || '<span style="color:var(--muted)">予測データなし (skyfield 未導入 / TLE 取得待ち)</span>';

  // タイムライン表
  const tb = $('#hoTable tbody');
  tb.innerHTML = ho.slice().reverse().slice(0,30).map(h=>`
    <tr class="${h.future?'future':''}">
      <td>${fmtTs(h.ts)}</td><td>${h.future?'予測':'記録'}</td><td>${h.constellation}</td>
      <td>${h.from_sat||'—'} → ${h.to_sat||'—'}</td><td>${h.reason}</td>
      <td>${h.from_elevation_deg??'—'} → ${h.to_elevation_deg??'—'}</td>
    </tr>`).join('');
}

// 測定先(セッション)ごとの色。SINR は常に橙(#ffb454)で重ね描き。
const SESSION_COLORS = ['#4da3ff','#6de3a1','#c58bff','#5ce1e6','#ff9e64','#7aa2f7','#f7768e'];
const sessionColor = (() => { const m = {}; let i = 0;
  return s => (m[s] ??= SESSION_COLORS[i++ % SESSION_COLORS.length]); })();

async function refreshCharts(rf) {
  const net = await getJSON('/api/net?'+q());
  const selected = $('#netsession').value;

  // 測定先セレクタを更新 (選択は維持)
  const sessions = [...new Set(net.map(n=>n.session))];
  const sel = $('#netsession');
  sel.innerHTML = '<option value="">(全て)</option>' + sessions.map(s=>`<option>${s}</option>`).join('');
  sel.value = sessions.includes(selected) ? selected : '';

  const shown = sel.value ? sessions.filter(s=>s===sel.value) : sessions;
  const rows = net.filter(n=>shown.includes(n.session));
  const bySes = dir => s => rows.filter(n=>n.session===s && n.direction===dir);
  const pts = (arr, fn) => arr.map(n=>({x:n.ts*1000, y:fn(n)}));

  const rfSinr = rf.filter(r=>r.sinr_db!=null).map(r=>({x:r.ts*1000,y:r.sinr_db}));
  const sinrDs = { label:'SINR (dB)', yAxisID:'y1', data:rfSinr, borderColor:'#ffb454', tension:.2 };

  lineChart('#chSinrTp', { type:'line', options:baseOpts(['Mbps','SINR dB']), data:{ datasets:[
    ...shown.flatMap(s => [
      { label:`${s} Down`, yAxisID:'y', data:pts(bySes('downlink')(s), n=>(n.throughput_bps||0)/1e6), borderColor:sessionColor(s), tension:.2 },
      { label:`${s} Up`, yAxisID:'y', data:pts(bySes('uplink')(s), n=>(n.throughput_bps||0)/1e6), borderColor:sessionColor(s), borderDash:[6,4], tension:.2 },
    ]),
    sinrDs,
  ]}});

  lineChart('#chSinrRtt', { type:'line', options:baseOpts(['ms','SINR dB']), data:{ datasets:[
    ...shown.flatMap(s => [
      { label:`${s} RTT`, yAxisID:'y', data:pts(bySes('downlink')(s), n=>n.rtt_ms), borderColor:sessionColor(s), tension:.2 },
      { label:`${s} Jitter`, yAxisID:'y', data:pts(bySes('downlink')(s), n=>n.jitter_ms), borderColor:sessionColor(s), borderDash:[6,4], tension:.2 },
    ]),
    sinrDs,
  ]}});

  lineChart('#chLoss', { type:'line', options:baseOpts(['%']), data:{ datasets:
    shown.map(s => ({ label:`${s} Loss`, yAxisID:'y', data:pts(bySes('downlink')(s), n=>n.loss_pct),
                      borderColor:sessionColor(s), tension:.2 })),
  }});
}

// ---- 計測コントロール ----------------------------------------------------
const JOB_GROUPS = { rf:'電波 (RF) コレクタ', net:'通信品質 測定先',
                     handover:'ハンドオーバー予測', server:'受信サーバ' };

async function refreshJobs() {
  const jobs = await getJSON('/api/jobs');
  let html = '';
  for (const [kind, title] of Object.entries(JOB_GROUPS)) {
    const rows = jobs.filter(j=>j.kind===kind);
    if (!rows.length) continue;
    html += `<div class="jobgroup"><div class="gt">${title}</div>` + rows.map(j=>`
      <div class="job">
        <label class="switch"><input type="checkbox" ${j.enabled?'checked':''}
          onchange="toggleJob('${j.id}', this.checked)"><span class="sl"></span></label>
        <span class="lbl">${j.label}</span>
        <span class="detail">${j.detail||''}</span>
        ${j.removable?`<button class="del" title="削除" onclick="delTarget('${j.id}')">✕</button>`:''}
      </div>`).join('') + '</div>';
  }
  $('#jobs').innerHTML = html || '<span class="hint">ジョブがありません (config.yaml を確認)</span>';
}

async function toggleJob(id, enabled) {
  await fetch(`/api/jobs/${encodeURIComponent(id)}/enable`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({enabled}) });
  refreshJobs();
}

async function addTarget() {
  const label = $('#tLabel').value.trim(), host = $('#tHost').value.trim();
  if (!host) { alert('相手ホスト (IP) を入力してください'); return; }
  const r = await fetch('/api/targets', { method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({label: label || host, host}) });
  const body = await r.json();
  if (!body.ok) { alert('追加できません: ' + (body.error||'')); return; }
  $('#tLabel').value = ''; $('#tHost').value = '';
  refreshJobs();
}

async function delTarget(id) {
  if (!confirm('この測定先を削除しますか?')) return;
  await fetch(`/api/targets/${encodeURIComponent(id)}`, {method:'DELETE'});
  refreshJobs();
}

function baseOpts(axes) {
  const o = { responsive:true, interaction:{mode:'index',intersect:false},
    scales:{ x:{ type:'time'==='time'?'linear':'linear', ticks:{ color:'#8b98b0', callback:v=>new Date(v).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}) }, grid:{color:'#232c40'} },
      y:{ position:'left', title:{display:true,text:axes[0],color:'#8b98b0'}, ticks:{color:'#8b98b0'}, grid:{color:'#232c40'} } },
    plugins:{ legend:{ labels:{color:'#e6ebf5'} } } };
  if (axes[1]) o.scales.y1 = { position:'right', title:{display:true,text:axes[1],color:'#8b98b0'}, ticks:{color:'#8b98b0'}, grid:{drawOnChartArea:false} };
  return o;
}

async function refresh() {
  await refreshSources();
  await refreshJobs();
  const rf = await refreshRF();
  await refreshCharts(rf);
  await refreshServing();
  $('#updated').textContent = '更新: ' + new Date().toLocaleTimeString('ja-JP');
}

$('#minutes').onchange = refresh;
$('#source').onchange = refresh;
$('#netsession').onchange = refresh;
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
